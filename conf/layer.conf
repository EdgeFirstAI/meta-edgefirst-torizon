# meta-edgefirst-torizon: Torizon OS integration for the EdgeFirst
# Perception Platform on Toradex Verdin i.MX 8M Plus and i.MX 95.

BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-edgefirst-torizon"
BBFILE_PATTERN_meta-edgefirst-torizon = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-edgefirst-torizon = "20"
LAYERVERSION_meta-edgefirst-torizon = "1"
LAYERSERIES_COMPAT_meta-edgefirst-torizon = "walnascar"
LAYERDEPENDS_meta-edgefirst-torizon = "meta-edgefirst"

# EdgeFirst release identity. The variables and their derivations come from
# meta-edgefirst; these are the Torizon values. The version follows
# DISTRO_VERSION, which setup-edgefirst derives from EDGEFIRST_VERSION, and
# EDGEFIRST_FEED_BSP names the Torizon release as <family>-<version>.
EDGEFIRST_VERSION ?= "${TDX_RELEASE}${TDX_PRERELEASE}"
EDGEFIRST_VENDOR ?= "Toradex Torizon"
EDGEFIRST_FEED_BSP ?= "torizon-7.0.0-devel"

# Weston, and the Wayland variant of the GPU userspace, need these features.
# The Torizon distro strips them through DISTRO_FEATURES_REMOVE.
DISTRO_FEATURES:append = " wayland opengl"
DISTRO_FEATURES_REMOVE:remove = "wayland opengl"

# Weston's accounts. The Torizon distro allocates users and groups from static
# tables, so the ones Weston and weston-init create are listed here.
USERADD_UID_TABLES:append = " files/edgefirst-static-passwd"
USERADD_GID_TABLES:append = " files/edgefirst-static-group"

# Kernel revisions that carry the Verdin device trees the machine configs
# list; the revisions pinned by meta-toradex-nxp predate them.
SRCREV_machine:pn-linux-toradex-imx = "d2f1fc1e0ae9242a266fcaf287d7c0d943bc7c75"
SRCREV_torizon-meta:pn-linux-toradex-imx:verdin-imx95 = "19e06246fe4a938c64288c3add0512d1fdda8c80"

# The Torizon layer set has no meta-kinara.
PACKAGECONFIG_SOC:remove:mx8mp-nxp-bsp = "ara2"
PACKAGECONFIG_SOC:remove:mx9-nxp-bsp = "ara2"
ML_NNSTREAMER_PKGS:remove:mx8mp-nxp-bsp = "nnstreamer-ara2"
ML_NNSTREAMER_PKGS:remove:mx9-nxp-bsp = "nnstreamer-ara2"

# nnshark and gst-shark depend on libgpuperfcnt from meta-imx-sdk.
ML_GST_PROFILER:verdin-imx8mp = ""
ML_GST_PROFILER:mx95-nxp-bsp = ""

CORE_IMAGE_BASE_INSTALL:remove:sota = "rac tzn-mqtt auto-provisioning"

# NXP's i.MX 8M Plus GPU/NPU stack from the L6.12.49-2.2.0 release (Vivante
# 6.4.11.p4.2). The layer carries the p4.2 recipes because meta-imx-bsp, which
# provides them, is not part of the Torizon layer set; meta-freescale only has
# p3.2. User space and the galcore module must be the same release.
# The p4.2 packages ship the NXP Software License v63 (LA_OPT_NXP_Software_License),
# which the pinned meta-freescale does not yet list; meta-imx-bsp registers it
# the same way.
FSL_EULA_FILE_MD5SUMS:append = " bc649096ad3928ec06a8713b8d787eac"

PREFERRED_VERSION_imx-gpu-viv:mx8-nxp-bsp = "6.4.11.p4.2"
PREFERRED_VERSION_imx-gpu-g2d:mx8-nxp-bsp = "6.4.11.p4.2"
PREFERRED_VERSION_kernel-module-imx-gpu-viv:mx8-nxp-bsp = "6.4.11.p4.2"
